# jMaLe Application Configuration

# Application Information
app.name=jMaLe
app.version=1.0-SNAPSHOT
app.description=Java Machine Learning Library

# OpenTelemetry Configuration
# These can be overridden by environment variables
otel.service.name=${app.name}
otel.service.version=${app.version}
otel.resource.attributes=service.name=${otel.service.name},service.version=${otel.service.version}

# OTLP Exporter Configuration
# Set OTEL_EXPORTER_OTLP_ENDPOINT environment variable to override
# Example: http://localhost:4317 for local development
# Example: https://observe-api.observeinc.com:443 for Observe
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
otel.exporter.otlp.headers=${OTEL_EXPORTER_OTLP_HEADERS:}

# Metrics Configuration
otel.metrics.export.interval=30s
otel.metrics.export.timeout=10s

# Tracing Configuration
otel.traces.export.timeout=10s
otel.traces.sampler=parentbased_traceidratio
otel.traces.sampler.arg=1.0

# Logging Configuration
otel.logs.export.timeout=10s

# Health Check Configuration
health.check.enabled=true
health.check.interval=60s

# Performance Monitoring
performance.monitoring.enabled=true
performance.monitoring.memory.threshold=75
performance.monitoring.cpu.threshold=80

# Development/Debug Settings
# Set to true for development environments
debug.logging.enabled=${DEBUG_LOGGING:false}
debug.metrics.console.enabled=${DEBUG_METRICS:false}
debug.traces.console.enabled=${DEBUG_TRACES:false}
